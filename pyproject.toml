[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pythonbpf"
version = "0.1.9"
description = "Reduced Python frontend for eBPF"
authors = [
  { name = "r41k0u", email="pragyanshchaturvedi18@gmail.com" },
  { name = "varun-r-mallya", email="varunrmallya@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Operating System Kernels :: Linux",
]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"

dependencies = [
  "llvmlite>=0.49",
  "astpretty",
  "pylibbpf"
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-copybutton",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ctypeslib2",
    # Pinned rather than left to ctypeslib2's own (unpinned) dependency: pip
    # installs the latest release by default, and its libclang API surface
    # can be newer than the system libclang (e.g. Ubuntu 24.04 ships
    # libclang-16), which fails with a LibclangError about an undefined
    # symbol. Older bindings against a newer libclang stay compatible, so
    # pin to an old-enough release instead of pinning apt's libclang.
    "clang==16.0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pythonbpf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
markers = [
    "verifier: requires sudo/root for kernel verifier tests (not run by default)",
    "vmlinux: requires vmlinux.py for current kernel",
]
log_cli = false

[tool.coverage.run]
source = ["pythonbpf"]
omit = ["*/vmlinux*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
